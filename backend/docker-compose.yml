version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: companion_k0cy
      POSTGRES_USER: companion_k0cy_user
      POSTGRES_PASSWORD: eGWFShs7fy9WneTuCQeUVFtTyEGQpLfW
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    command: ["./entrypoint.sh"]
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=backend.backend.settings
      - DATABASE_URL=postgresql://companion_k0cy_user:eGWFShs7fy9WneTuCQeUVFtTyEGQpLfW@dpg-d1ft5lali9vc739v46og-a/companion_k0cy
      - ALLOWED_HOSTS=*
    depends_on:
      - db
    networks:
      - appnet
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - appnet
    ports:
      - "80:80"

volumes:
  postgres_data:

networks:
  appnet:
    driver: bridge
